<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9d0f5">
<title>Gym Buddy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1 id="title">Gym Buddy ✦</h1>
  <span class="cue-pill" id="motto">Every rep is a gift to future you ✦</span>
</header>

<main id="view" aria-live="polite"></main>

<div id="timerbar" class="timerbar" hidden></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="workout" class="active"><span class="ic">🏋️</span>Workout</button>
  <button role="tab" data-tab="progress"><span class="ic">📈</span>Progress</button>
  <button role="tab" data-tab="library"><span class="ic">📖</span>Library</button>
  <button role="tab" data-tab="settings"><span class="ic">⚙️</span>Settings</button>
</nav>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
